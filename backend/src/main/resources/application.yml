server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: wepay-promotion-backend
  main:
    allow-bean-definition-overriding: true
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 5000ms
    password:
  jackson:
    default-property-inclusion: non_null

# MyBatis
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.wepay.promotion.entity
  configuration:
    map-underscore-to-camel-case: true

