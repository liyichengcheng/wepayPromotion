server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: wepay-promotion-backend
  main:
    allow-bean-definition-overriding: true
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 5000ms
    password:
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# MyBatis
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.wepay.promotion.entity
  configuration:
    map-underscore-to-camel-case: true

# ShardingSphere 配置已移至 shardingsphere.yaml
# 由 ShardingSphereConfig.java 加载创建 DataSource Bean
wx:
  miniapp:
    appid: wxefa531580e370957
    secret: ba700ff366edfce3dc628ddb8ebdd978
  pay:
    mch-id: 1749127860
    mch-key: LPfhyebbjuOI158328OWCVghspoumqwv
    notify-url: http://nj409uu6213.vicp.fun/api/pay/notify
    transferAuthNotify-url: https://nj409uu6213.vicp.fun/api/income/transferAuthNotify
    cert-path: D:/Users/clinton/Downloads/cert/apiclient_cert.p12
    transfer-desc: 文章分享佣金
    # 开发环境Mock转账: 商户未开通「商家转账到零钱」(V3) 时设为 true 模拟成功, 生产必须 false
    mock-transfer: false
    # ========= V3 商家转账到零钱必填配置 (开通产品后填充) =========
    # APIv3 密钥 (32字节, 在商户平台"API安全"菜单设置, 与 V2 mch-key 是两个不同东西)
    v3-key: ba700ff366edfce3dc628ddb8ebdd978
    # 商户 API 私钥路径 (apiclient_key.pem, 请先转成 PKCS8:
    #   openssl pkcs8 -topk8 -inform PEM -in apiclient_key.pem -out apiclient_key_pkcs8.pem -nocrypt)
    private-key-path: D:/Users/clinton/Downloads/cert/apiclient_key_pkcs8.pem
    # 商户 API 证书序列号 (在商户平台"API安全"页面, 或从 apiclient_cert.pem 读取)
    merchant-serial: 16BE170CF772288B5570419BE96A88BAFF36F9BB
    # ========= 微信支付公钥模式 (推荐, 替代平台证书) =========
    # 在商户平台"账户中心-API安全-微信支付公钥"申请并下载 pub_key.pem + 公钥ID
    # 公钥路径 (PEM 格式, 含 -----BEGIN PUBLIC KEY-----)
    public-key-path: D:/Users/clinton/Downloads/cert/pub_key.pem
    # 公钥 ID (形如 PUB_KEY_ID_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx)
    public-key-id: PUB_KEY_ID_0117491278602026080700111554000604
    # 微信支付平台证书路径 wechatpay.pem (灰度切换期兼容, 已完成切换可置空)
    platform-cert-path: D:/Users/clinton/Downloads/cert/apiclient_cert.pem
  share:
    aes-key: 2ShAYqaH/y1octey6WKr0w==

# 日志配置见 logback-spring.xml (按级别+日期分文件输出到 logs/ 目录)
logging:
  config: classpath:logback-spring.xml

# 管理员后台密码 (Basic Auth)
admin:
  password: admin123

# 文章定价策略 (单位:分, 1分=0.01元)
pay:
  price:
    base-fen: 1        # 基础价, 付费人数≤step-count时此价
    max-fen: 5         # 封顶价
    step-count: 2      # 步长: ≤此值返回基础价, 超过后每增加此值人数加1分

# 实名认证配置
idcard:
  # 身份证图片存储目录
  upload-dir: D:/Users/clinton/Downloads/idcard
  # 实名认证阈值(分): 累计提现达此值时强制实名, 3000元=300000分  todo
  real-name-threshold-fen: 30
  # 客服微信号 (用户提交实名信息后提示添加)
  customer-wechat: java_cex
