<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 佣金提现审核</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">管</div>
            <h1 class="login-title">佣金提现审核</h1>
            <p class="login-subtitle">管理后台 · 请输入管理员密码登录</p>

            <form id="loginForm" onsubmit="return doLogin(event)">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input class="form-input" type="text" id="username" value="admin" placeholder="admin" autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input class="form-input" type="password" id="password" placeholder="请输入管理员密码" autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary" id="btnLogin">登 录</button>
            </form>
        </div>
    </div>

    <script>
        // 已登录则直接跳转
        if (localStorage.getItem('admin_auth')) {
            location.href = './index.html';
        }

        function doLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!username || !password) {
                showToast('请输入用户名和密码', 'error');
                return false;
            }
            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.textContent = '登录中...';

            const creds = btoa(username + ':' + password);
            // 调用一个管理API来验证
            fetch('../api/admin/withdraw/pending', {
                headers: {
                    'Authorization': 'Basic ' + creds
                }
            }).then(res => {
                if (res.ok) {
                    localStorage.setItem('admin_auth', creds);
                    showToast('登录成功', 'success');
                    setTimeout(() => {
                        location.href = './index.html';
                    }, 400);
                } else if (res.status === 401 || res.status === 403) {
                    showToast('用户名或密码错误', 'error');
                    resetBtn();
                } else {
                    showToast('登录失败: ' + res.status, 'error');
                    resetBtn();
                }
            }).catch(err => {
                showToast('网络错误: ' + err.message, 'error');
                resetBtn();
            });
            return false;
        }

        function resetBtn() {
            const btn = document.getElementById('btnLogin');
            btn.disabled = false;
            btn.textContent = '登 录';
        }

        function showToast(msg, type) {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + (type || 'info');
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }
    </script>
</body>
</html>
